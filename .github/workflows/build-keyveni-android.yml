name: Build Keyveni Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "assets/icon.svg"
      - ".github/workflows/build-keyveni-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Android launcher icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg, io, os
          from PIL import Image
          svg = open("assets/icon.svg", encoding="utf-8").read()
          image = Image.open(io.BytesIO(cairosvg.svg2png(bytestring=svg.encode(), output_width=512, output_height=512))).convert("RGBA")
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              image.resize((size,size), Image.Resampling.LANCZOS).save(f"{folder}/ic_launcher.png", optimize=True)
          PY
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Keyveni-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
